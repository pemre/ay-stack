# One GitHub Pages site for the whole workspace.
#
# A repository has exactly one Pages site, so the two pre-migration workflows
# (Bürküt's deploy.yml and the library's deploy-docs.yml) fought over it: both
# used the `pages` concurrency group and both called actions/deploy-pages, so
# whichever finished last replaced the other's site. This workflow replaces both.
#
#   Storybook  -> https://pemre.github.io/ay-stack/
#   Bürküt     -> https://pemre.github.io/ay-stack/burkut/
#
# Prerequisite: Settings -> Pages -> Source -> "GitHub Actions".
name: Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  # Warms the pnpm store cache once so both build jobs restore instead of
  # downloading. The cache key is the lockfile, so a dependency change misses and
  # anything else hits (Requirements 14.3, 14.4).
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install
        run: pnpm install --frozen-lockfile

  # Storybook takes the site root: the library docs are the durable primary
  # artifact of this repository (Requirement 14.1).
  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install
        run: pnpm install --frozen-lockfile

      # Storybook's tailwind.css imports @ay/tokens/theme.css, which resolves to
      # the package's dist/. A filtered run does not build workspace dependencies
      # on its own, so the `^...` selector builds them explicitly first.
      - name: Build workspace dependencies
        run: pnpm --filter "@ay/ui-library^..." build

      - name: Build Storybook
        run: pnpm --filter @ay/ui-library build-storybook
        env:
          STORYBOOK_BASE: /ay-stack/

      - name: Upload Storybook output
        uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: packages/ui-library/storybook-static
          if-no-files-found: error

  # Bürküt takes the /burkut/ subpath (Requirement 14.2). GITHUB_PAGES flips its
  # Vite base to /ay-stack/burkut/, matching the `homepage` in its manifest.
  build-burkut:
    name: Build Bürküt
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install
        run: pnpm install --frozen-lockfile

      # `burkut...` includes Bürküt's workspace dependencies and pnpm runs them in
      # topological order, so @ay/tokens and @ay/ui-library build before the app.
      - name: Build
        run: pnpm --filter "burkut..." build
        env:
          GITHUB_PAGES: "true"

      - name: Upload Bürküt output
        uses: actions/upload-artifact@v4
        with:
          name: burkut
          path: apps/burkut/dist
          if-no-files-found: error

  # Storybook lands at the artifact root, Bürküt in site/burkut/. Because Bürküt
  # goes into a fresh subdirectory, no filename can collide between the two.
  assemble:
    name: Assemble Pages artifact
    runs-on: ubuntu-latest
    needs: [build-storybook, build-burkut]
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Download Storybook output
        uses: actions/download-artifact@v4
        with:
          name: storybook
          path: site

      - name: Download Bürküt output
        uses: actions/download-artifact@v4
        with:
          name: burkut
          path: site/burkut

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # `needs: [assemble]` is what makes Requirement 14.5 structural: neither build
  # job can fail without short-circuiting the deployment, and no artifact is
  # published when one does.
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [assemble]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
